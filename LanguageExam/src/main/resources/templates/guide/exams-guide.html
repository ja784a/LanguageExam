<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="#{exams-guide}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<div class="row">
				<div class="row">
					<h3 th:text="#{exam-guide-header}"></h3>
				</div>
			</div>
			<div th:each="subject:${subjects}">
				<div class="row pt-1">
					<div class="col-sm-4" style="background-color: darkblue;">
						<h1 th:text="${subject.subject}" class="text-light"></h1>
					</div>
					<div class="col-sm-3" style="background-color: darkblue;">
						<h4 th:text="${grades}" class="text-light"></h4>
					</div>
					<div class="col-sm-5">
						<form th:action="@{/call-select-grade}" method="post">
							<input type="hidden" name="subjectId" th:value="${subject.id}">
							<button type="submit" th:text="#{book}" style="font-size: 30px;" class="text-large text-light btn bg-primary rounded-pill"></button>
						</form>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<a th:href="@{/exam-details/{id} (id = ${subject.id})}" th:text="#{exam-details-link}" style="font-size: 30px;"></a>
					</div>
				</div>
			</div>
			<div class="row pt-3 justify-content-center">
				<div class="col-10">
					<h3 th:text="#{infos}"></h3>
				</div>
			</div>
			<div class="row justify-content-center">
				<ul class="list-group col-10 m-2 border border-dark" style=" height: 200px; overflow-y: scroll;">
					<li class="list-group-item" th:each="info:${infos}">
						<div th:text="${#dates.format(info.postDate, 'yyyy年MM月dd日(E)')}"></div>
						<a th:text="${info.title}" th:href="@{/info-details/{id} (id = ${info.id})}"></a>
					</li>	
				</ul>
			</div>
		</div>
	</div>

</body>
</html>

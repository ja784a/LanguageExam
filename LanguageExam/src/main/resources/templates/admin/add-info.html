<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{add-info-long}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div layout:fragment="content">
		<div class="container" style="width: 800px;">
			<div class="row">
				<div class="col">
					<h4 th:text="#{add-info-long}"></h4>
				</div>
			</div>
			<form th:action="@{/add-info-for-admin}" method="post" th:object="${addEditInfoForm}">
				<div class="row">
					<dvi class="col">
						<h5 th:text="#{title}"></h5>
					</dvi>
				</div>
				<div class="row">
					<div class="col">
						<input type="text" th:field="*{title}" th:errorclass="is-invalid" style="width: 500px;">
						<div class="invalid-feedback" th:errors="*{title}"></div>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<h5 th:text="#{content}"></h5>
					</div>
				</div>
				<div class="row">
					<div class="col">
						<textarea th:field="*{content}" th:errorclass="is-invalid" style="width: 500px;"></textarea>
						<div class="invalid-feedback" th:errors="*{content}"></div>
					</div>
				</div>
				<div class="row m-3 justify-content-end">
					<div class="col-3">
						<a th:href="@{/admin-infos-for-admin}" th:text="#{back}"></a>
					</div>
					<div class="col-3">
						<input type="submit" th:value="#{add-info-btn}" class="btn btn-danger">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{admin-infos}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/admin-infos-for-admin.css}">
</head>
<body>
	<div layout:fragment="content">
		<div class="container" style="width: 800px;">
			<div class="row m-2 justify-content-center">
				<div class="col-7">
					<h4 class="pt-1" th:text="#{admin-infos}"></h4>
				</div>
				<div class="col-3">
					<a th:href="@{/add-info-for-admin}" th:text="#{add-info}" class="btn btn-primary"></a>
				</div>
			</div>
			<div class="row m-2 justify-content-center">
				<div class="col-10 border border-dark" style="height: 300px; overflow-y: scroll; ">
					<div th:each="info,stat :${infos}">
						<div class="border border-dark" th:classappend="${stat.index % 2 == 0} ? 'bg-secondary' : ' '">
							<div class="row mt-3">
								<div class="col-6">
									<div class="row">
										<div class="col">
											<div th:text="${#dates.format(info.postDate, 'yyyy年MM月dd日(E)')}"></div>
										</div>
									</div>
									<dvi class="row">
										<dvi class="col">
											<h5 th:text="${info.title}" class="info-title"></h5>
										</dvi>
									</dvi>
								</div>
								<div class="col-3">
									<a th:href="@{/edit-info-for-admin/{id} (id = ${info.id})}" th:text="#{edit-info}" class="btn btn-primary"></a>
								</div>
								<div class="col-3">
									<a th:href="@{/delete-info-for-admin/{id} (id = ${info.id})}" th:text="#{delete-info}" class="btn btn-danger"></a>
								</div>
							</div>
							
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>

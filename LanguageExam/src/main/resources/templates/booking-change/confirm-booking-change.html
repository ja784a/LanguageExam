<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{confirm-booking-change}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{confirm-booking-change}"></h3>
			<p th:text="#{confirm-booking-change-msg}"></p>
			<form th:action="@{/confirm-booking-change}" method="post">
				<p class="text-center" th:text="#{new-booking}"></p>
				<div class="row justify-content-center">
					<div class="col-auto">
						<h5 th:text="${examInfo.subjects.subject}"></h5>
					</div>
					<div class="col-auto">
						<h5 th:text="${examInfo.grades.grade}"></h5>
					</div>
				</div>
				<h5 class="text-center" th:text="#{exam-date} + ${#dates.format(examInfo.examDate, 'yyyy年MM月dd日(E)')}"></h5>
				<div class="row justify-content-center">
					<div class="col-auto">
						<h5 th:text="#{place} + ${examInfo.places.place}"></h5>
					</div>
					<div class="col-auto">
						<h5 th:text="#{fee} + ${fee.fee} + #{yen}"></h5>
					</div>
				</div>
				<div class="row m-5 justify-content-end">
					<div class="col-auto">
						<a th:href="@{/select-exam-date}" th:text="#{back-change-exam-date}" class="btn btn-secondary mb-1 rounded-pill text-light"></a>
					</div>
					<div class="col-auto">
						<input type="submit" th:value="#{complete-booking-change-btn}" class="btn btn-danger rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

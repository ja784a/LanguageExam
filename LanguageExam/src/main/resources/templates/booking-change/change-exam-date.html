<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="${subject.subject} + ' ' + ${grade.grade} + ' ' + #{date-change}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="${subject.subject}" class="text-light m-1 p-1" style="background-color: darkblue; width: 200px;"></h3>
			<div class="row">
				<div class="col-sm-3 col-6">
					<h3 th:text="#{booking-change}"></h3>
				</div>
				<div class="col-sm-4 col-6">
					<h4 th:text="#{grade} + ${grade.grade}" class="text-end"></h4>
					<h4 th:text="#{place} + ${place.place}" class="text-end"></h4>
				</div>
			</div>
			<p th:text="#{select-exam-date-msg}"></p>
			<form th:action="@{/change-exam-date}" method="post" th:object="${selectExamDateForm}">
				<div th:if="${examDates.size == 0}">
					<p th:text="#{no-dates-msg}" class="text-danger"></p>
				</div>
				<div th:if="${examDates.size != 0}">
					<select th:field="*{examId}" th:errorclass="is-invalid" class="form-select bg-secondary text-light" style="width: 200px;">
						<option th:each="date:${examDates}" th:text="${#dates.format(date.examDate, 'yyyy年MM月dd日(E)')}" th:value="${date.id}"></option>
					</select>
					<div class="invalid-feedback" th:errors="*{examId}"></div>
				</div>
				<div class="row pb-3 justify-content-end mt-5">
					<div class="col-auto">
						<a th:href="@{/change-place/{id} (id = ${oldExamId})}" th:text="#{back-change-place}" class="btn btn-secondary rounded-pill text-light"></a>
					</div>
					<div class="col-auto" th:if="${examDates.size != 0}">
						<input type="submit" th:value="#{confirm-booking-change-btn}" class="btn btn-primary rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{complete-booking}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<div class="row">
				<div class="col">
					<h3 th:text="#{complete-booking}"></h3>
				</div>
			</div>
			<div class="p-3 justify-content-center">
				<div class="border border-dark" style="height: 200px; background-color: darkgray;">
					<div class="row mt-5 justify-content-center">
						<div class="col-sm-4">
							<h5 th:text="#{complete-booking-msg}" class="text-center"></h5>
						</div>
					</div>
					<div class="row justify-content-center">
						<div class="col-sm-4">
							<div class="text-center"><a th:href="@{/exam-schedule}" th:text="#{exam-schedule-link}"></a></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>

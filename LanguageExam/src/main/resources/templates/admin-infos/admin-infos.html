<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{admin-infos}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/admin-infos-for-admin.css}">
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<div class="row m-2 justify-content-center">
				<div class="col-auto">
					<h3 class="pt-1" th:text="#{admin-infos}"></h3>
				</div>
				<div class="col-auto">
					<a th:href="@{/add-info-for-admin}" th:text="#{add-info-btn}" class="btn btn-primary rounded-pill"></a>
				</div>
			</div>
			<p  th:if="${infos.size == 0}" class="text-center m-5" th:text="#{no-infos-msg}"></p>
			<ul class="list-group mb-3">
				<li th:each="info:${infos}" class="list-group-item border border-dark">
					<div class="row mt-3">
						<p th:text="${#dates.format(info.postDate, 'yyyy年MM月dd日(E)')}"></p>
						<div class="col-sm-6">
							<h5 th:text="${info.title}"></h5>
						</div>
						<div class="col-auto">
							<a th:href="@{/edit-info-for-admin/{id} (id = ${info.id})}" th:text="#{edit-info}" class="btn btn-primary"></a>
						</div>
						<div class="col-auto">
							<a th:href="@{/delete-info-for-admin/{id} (id = ${info.id})}" th:text="#{delete-info}" class="btn btn-danger"></a>
						</div>
					</div>
				</li>
			</ul>
		</div>
	</div>

</body>
</html>

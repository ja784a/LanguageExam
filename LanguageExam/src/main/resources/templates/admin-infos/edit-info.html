<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{edit-info-long}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{edit-info-long}"></h3>
			<form th:action="@{/edit-info-for-admin/{id} (id = ${id})}" method="post" th:object="${addEditInfoForm}">
				<h5 th:text="#{title}"></h5>
				<input type="text" th:field="*{title}" th:errorclass="is-invalid" class="col-10">
				<div class="invalid-feedback" th:errors="*{title}"></div>
				<h5 th:text="#{content}"></h5>
				<textarea th:field="*{content}" th:errorclass="is-invalid" class="col-10"></textarea>
				<div class="invalid-feedback" th:errors="*{content}"></div>
				<div class="row mb-3 mt-5 justify-content-end">
					<div class="col-auto">
						<a th:href="@{/admin-infos-for-admin}" th:text="#{back}" class="btn btn-secondary rounded-pill text-light"></a>
					</div>
					<div class="col-auto">
						<input type="hidden" th:field="*{id}">
						<input type="submit" th:value="#{edit-info-btn}" class="btn btn-danger rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

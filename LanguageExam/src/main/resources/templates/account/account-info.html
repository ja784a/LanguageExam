<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{account-info}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{account-info}"></h3>
			<div class="row mt-5 justify-content-center">
				<div class="col-sm-3">
					<h5 th:text="#{name} + ':'" class="text-end"></h5>
				</div>
				<div class="col-sm-9">
					<h5 th:text="${account.name}"></h5>
				</div>
			</div>
			<div class="row mt-2 justify-content-center">
				<div class="col-sm-3">
					<h5 th:text="#{mail} + ':'" class="text-end"></h5>
				</div>
				<div class="col-sm-9">
					<h5 th:text="${account.mail}" class="col-sm-9"></h5>
				</div>
			</div>
			<div class="row mb-5 mt-2 justify-content-center">
				<div class="col-sm-3">
					<h5 th:text="#{address} + ':'" class="text-end"></h5>
				</div>
				<div class="col-sm-9">
					<h5 th:text="${account.pref} + ${account.city} + ${account.town} + ${account.building}"></h5>
				</div>
			</div>
			<div class="text-end m-3">
				<a th:href="@{/change-account-info}" th:text="#{change-account-info-btn}" class="btn btn-primary text-light rounded-pill"></a>
			</div>
		</div>
	</div>

</body>
</html>

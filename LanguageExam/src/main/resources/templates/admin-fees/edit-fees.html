<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{edit-fees}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<form th:action="@{/edit-fees-for-admin}" method="post" th:object="${feesListForm}">
				<h3 class="text-center" th:text="#{edit-fees}"></h3>
				<div th:each="subject, sStat:*{subjects}">
					<div class="row mt-2 justify-content-center">
						<div class="col-sm-2 col-6">
							<h5 th:text="${subject.subject}"></h5>
						</div>
						<div class="col-sm-2 col-6">
							<h6 th:each="grade:${subject.gradeList}" th:text="${grade.grade}"></h6>
						</div>
						<div class="col-sm-3 col-6">
							<div th:each="grade, fStat:*{subjects[__${sStat.index}__].gradeList}">
								<div class="row">
									<div class="col-4">
										<input type="number" min="0" style="width: 80px;"th:field="*{subjects[__${sStat.index}__].gradeList[__${fStat.index}__].fees.fee}" th:errorclass="is-invalid">
										<p class="invalid-feedback" th:errors="*{subjects[__${sStat.index}__].gradeList[__${fStat.index}__].fees.fee}"></p>
									</div>
									<div class="col-3">
										<p th:text="#{yen}"></p>
									</div>
								</div>
								<input type="hidden" th:field="*{subjects[__${sStat.index}__].gradeList[__${fStat.index}__].fees.id}">
							</div>
						</div>
					</div>
				</div>
				<div class="row justify-content-center m-3">
					<div class="col-auto">
						<a th:href="@{/admin-fees-for-admin}" th:text="#{back}" class="btn btn-secondary rounded-pill text-light"></a>
					</div>
					<div class="col-auto">
						<input type="submit" th:value="#{edit-fees-btn}" class="btn btn-danger rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

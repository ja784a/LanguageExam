<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{login}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div layout:fragment="content">
		<div class="container" style="width:800px">
			<div class="row">
				<div class="col">
					<h2 th:text="#{login}"></h2>
				</div>
			</div>
			<form th:action="@{/login}" method="post">
				<div class="row p-5 justify-content-center">
					<label th:text="#{mail}" class="form-label col-2 text-end" for="mail"></label>
					<div class="col-7">
						<input type="email" name="mail" class="form-control border-dark">
					</div>
				</div>
				<div class="row p-5 justify-content-center">
					<label th:text="#{pass}" class="form-label col-2 text-end" for="pass"></label>
					<div class="col-7">
						<input type="pass" name="pass" class="form-control border-dark">
					</div>
				</div>
				<div class="row p-1 justify-content-end">
					<div class="col-4">
						<a th:href="@{/register-account}" th:text="#{register}" class="text-end"></a>
					</div>
					<div class="col-3">
						<input type="submit" th:value="#{login}" class="btn btn-primary rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

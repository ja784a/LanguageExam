<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{login}"></title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{login}"></h3>
			<form th:action="@{/login}" method="post">
				<div th:if="${session['SPRING_SECURITY_LAST_EXCEPTION']} != null" th:text="#{login-error}" class="text-danger text-center"></div>
				<div class="row p-5 justify-content-center">
					<label th:text="#{mail}" class="form-label col-sm-2 text-sm-end" for="mail"></label>
					<div class="col-sm-7">
						<input type="email" name="mail" class="form-control">
					</div>
				</div>
				<div class="row p-5 justify-content-center">
					<label th:text="#{pass}" class="form-label col-sm-2 text-sm-end" for="pass"></label>
					<div class="col-sm-7">
						<input type="password" name="pass" class="form-control">
					</div>
				</div>
				<div class="row p-1 justify-content-end">
					<div class="col-4">
						<a th:href="@{/register-account}" th:text="#{register}" class="text-end"></a>
					</div>
					<div class="col-3">
						<input type="submit" th:value="#{login-btn}" class="btn btn-primary rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

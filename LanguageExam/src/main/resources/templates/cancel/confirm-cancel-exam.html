<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{confirm-cancel-exam}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{confirm-cancel-exam}"></h3>
			<p th:text="#{confirm-cancel-exam-msg}"></p>
			<form th:action="@{/confirm-cancel-exam}" method="post" th:object="${cancelExamForm}">
				<div class="row mt-5 justify-content-center">
					<div class="col-auto">
						<h5 th:text="${examInfo.subjects.subject}"></h5>
					</div>
					<div class="col-auto">
						<h5 th:text="${examInfo.grades.grade}"></h5>
					</div>
				</div>
				<h5 class="text-center" th:text="#{exam-date} + ${#dates.format(examInfo.examDate, 'yyyy年MM月dd日(E)')}"></h5>
				<div class="row justify-content-center">
					<div class="col-auto">
						<h5 th:text="#{place} + ${examInfo.places.place}"></h5>
					</div>
					<div class="col-auto">
						<h5 th:text="#{fee} + ${fee.fee} + #{yen}"></h5>
					</div>
				</div>
				<div class="row mt-5 justify-content-end">
					<div class="col-auto">
						<a class="btn btn-secondary rounded-pill text-light" th:href="@{/exam-schedule}" th:text="#{back}"></a>
					</div>
					<div class="col-auto">
						<input type="hidden" th:field="*{examId}">
						<input type="submit" th:value="#{complete-cancel-btn}" class="btn btn-danger rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

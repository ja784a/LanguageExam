<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{cancel-exam-for-admin-long}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{cancel-exam-for-admin-long}"></h3>
			<p th:text="#{cancel-exam-for-admin-msg}"></p>
			<form th:action="@{/cancel-exam-for-admin/{id} (id = ${examInfo.id})}" method="post" th:object="${cancelExamFormForAdmin}">
				<div class="row mt-5 justify-content-center">
					<div class="col-auto">
						<h5 class="text-center" th:text="${examInfo.subjects.subject}"></h5>
					</div>
					<div class="col-auto">
						<h5 class="text-center" th:text="${examInfo.grades.grade}"></h5>
					</div>
				</div>
				<h5 class="text-center" th:text="#{place} + ${examInfo.places.place}"></h5>
				<h5 class="text-center" th:text="#{exam-date} + ${#dates.format(examInfo.examDate, 'yyyy年MM月dd日(E)')}"></h5>
				<h6 th:text="#{comments}"></h6>
				<textarea th:field="*{comments}" th:errorclass="is-invalid" class="col-10"></textarea>
				<div class="invalid-feedback" th:errors="*{comments}"></div>
				<div class="row m-3 justify-content-end">
					<div class="col-auto">
						<a th:href="@{/admin-exams-for-admin}" th:text="#{back}" class="btn btn-secondary rounded-pill text-light"></a>
					</div>
					<div class="col-auto">
						<input type="hidden" th:field="*{id}">
						<input type="submit" th:value="#{cancel-exam-for-admin-btn}" class="btn btn-danger rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://lutraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{change-exam-date-title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="#{change-exam-date-title}"></h3>
			<h6 th:text="${examInfo.subjects.subject} + ' ' + ${examInfo.grades.grade} + ' ' + ${examInfo.places.place} + ' ' + ${#dates.format(examInfo.examDate, 'yyyy年MM月dd日(E)')}"></h6>
			<form th:action="@{/change-exam-date-for-admin/{id} (id = ${examInfo.id})}" method="post" th:object="${changeExamDateForm}">
				<div class="row p-3">
					<div class="col-sm-3 col-6">
						<h6 th:text="#{new-date}"></h6>
					</div>
					<div class="col-sm-3 col-6">
						<input type="date" th:field="*{examDate}" class="form-control" th:errorclass="is-invalid">
						<div class="invalid-feedback" th:errors="*{examDate}"></div>
					</div>
				</div>
				<h6 th:text="#{comments}"></h6>
				<textarea th:field="*{comments}" th:errorclass="is-invalid" class="col-10"></textarea>
				<div class="invalid-feedback" th:errors="*{comments}"></div>
				<div class="row mb-3 mt-5 justify-content-end">
					<div class="col-auto">
						<a th:href="@{/admin-exams-for-admin}" th:text="#{back}" class="btn btn-secondary rounded-pill text-light"></a>
					</div>
					<div class="col-sm-3 col-6">
						<input type="hidden" th:field="*{oldDate}">
						<input type="hidden" th:field="*{id}">
						<input type="submit" th:value="#{change-exam-date-btn-for-admin}" class="btn btn-danger rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

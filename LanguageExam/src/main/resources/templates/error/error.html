<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{error}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container" style="width: 700px;">
			<h3 th:text="#{error}" class="text-danger"></h3>
			<p class="text-center mt-5" th:text="#{error-msg}" class="text-danger text-center"></p>
		</div>
	</div>

</body>
</html>

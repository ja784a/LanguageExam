<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="${subject.subject} + ' ' + #{select-place}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container">
			<h3 th:text="${subject.subject}" class="text-light p-1 m-1" style="background-color: darkblue; width: 200px;"></h3>
			<div class="row">
				<div class="col-sm-3 col-6">
					<h3 th:text="#{exam-book}"></h3>
				</div>
				<div class="col-sm-4 col-6">
					<h4 th:text="#{grade} + ${grade.grade}" class="text-end"></h4>
				</div>
			</div>
			<div class="row p-2">
				<div class="col-sm-3">
					<div th:text="#{select-place-msg}"></div>
				</div>
			</div>
			<form th:action="@{/select-place}" method="post" th:object="${selectPlaceForm}">
				<div class="row pt-2 pb-5">
					<div class="col-3 mb-5">
						<select th:field="*{placeId}" th:errorclass="is-invalid" class="form-select bg-secondary text-light">
							<option th:each="place:${places}" th:text="${place.place}" th:value="${place.id}"></option>
						</select>
						<div class="invalid-feedback" th:errors="*{placeId}"></div>
					</div>
				</div>
				<div class="row pb-3 justify-content-end mt-5">
					<div class="col-sm-3 col-6">
						<a th:href="@{/select-grade}" th:text="#{back-select-grade}" class="btn btn-secondary rounded-pill text-light"></a>
					</div>
					<div class="col-sm-4 col-6">
						<input type="submit" th:value="#{select-date-btn}" class="btn btn-primary rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>

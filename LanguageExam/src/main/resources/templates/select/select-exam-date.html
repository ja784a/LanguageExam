<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout" 
 layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="${subject.subject} + ' ' + ${grade.grade} + ' ' + #{select-exam-date}"></title>
</head>
<body>
	<div layout:fragment="content">
		<div class="container" style="width: 800px;">
			<div class="row p-1">
				<div class="col-3" style="background-color: darkblue;">
					<h5 th:text="${subject.subject}" class="text-light"></h5>
				</div>
			</div>
			<div class="row">
				<div class="col-3">
					<h3 th:text="#{exam-book}"></h3>
				</div>
				<div class="col-4">
					<div class="row">
						<div class="col">
							<h4 th:text="#{grade} + ${grade.grade}" class="text-end"></h4>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<h4 th:text="#{place} + ${place.place}" class="text-end"></h4>
						</div>
					</div>
				</div>
			</div>
			<div class="row p-2">
				<div class="col-3">
					<div th:text="#{select-exam-date-msg}"></div>
				</div>
			</div>
			<form th:action="@{/select-exam-date}" method="post" th:object="${selectExamDateForm}">
				<div class="row pt-2 pb-5">
					<div th:if="${examDates.size == 0}">
						<div class="col-5">
							<div th:text="#{no-dates-msg}" class="text-danger"></div>
						</div>
					</div>
					<div th:if="${examDates.size != 0}">
						<div class="col-3">
							<select th:field="*{examId}">
								<option th:each="date:${examDates}" th:text="${#dates.format(date.examDate, 'yyyy年MM月dd日(E)')}" th:value="${date.id}"></option>
							</select>
						</div>
					</div>
				</div>
				<div class="row pb-3 justify-content-end">
					<div class="col-3">
						<a th:href="@{/select-place}" th:text="#{back-select-place}"></a>
					</div>
					<div class="col-4" th:if="${examDates.size != 0}">
						<input type="submit" th:value="#{confirm-booking-btn}" class="btn btn-primary rounded-pill">
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>
